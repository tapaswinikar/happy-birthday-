<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>100 Reasons ❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="reasons.css">

</head>

<body>

    <!-- Background -->

    <div class="stars"></div>

    <div class="floating-hearts"></div>

    <!-- Main Container -->

    <div class="container">

        <h1>100 Reasons Why I Love You ❤️</h1>

        <p class="subtitle">

            Every click reveals another little piece of my heart...

        </p>

        <!-- Counter -->

        <div class="counter">

            <span id="currentReason">0</span>

            /

            <span>100</span>

        </div>

        <!-- Card -->

        <div class="reason-card">

            <h2>❤️</h2>

            <p id="reasonText">

                Click the button below to begin...

            </p>

        </div>

        <!-- Button -->

        <button id="showReason">

            Show Me A Reason ❤️

        </button>

        <!-- Finish Message -->

        <div id="finishMessage">

            <h2>

                ❤️ I Could Keep Going Forever ❤️

            </h2>

            <p>

                Every reason reminds me how lucky I am to have you.

                Happy Birthday, My Love.

            </p>

        </div>

        <!-- Next Button -->

        <a href="gift.html" id="nextBtn">

            Next Surprise 🎁

        </a>

    </div>

    <!-- Confetti -->

    <div id="confetti"></div>

    <!-- Audio -->

    <audio id="clickSound">

        <source src="music/pop.mp3" type="audio/mpeg">

    </audio>

    <script src="reasons.js"></script>

</body>

</html>

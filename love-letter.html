<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love Letter ❤️</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="love-letter.css">
</head>

<body>

    <!-- Background Stars -->
    <div class="stars"></div>

    <!-- Floating Hearts -->
    <div class="floating-hearts"></div>

    <!-- Main Container -->
    <div class="container">

        <!-- Heading -->
        <h1 class="title">
            A Letter From My Heart ❤️
        </h1>

        <p class="subtitle">
            Click the envelope to open your surprise...
        </p>

        <!-- Envelope -->
        <div class="envelope-container">

            <div class="envelope" id="envelope">

                <div class="envelope-front"></div>

                <div class="envelope-flap"></div>

                <div class="heart-seal">
                    ❤️
                </div>

            </div>

        </div>

        <!-- Letter -->
        <div class="letter" id="letter">

            <div class="paper">

                <h2>My Dearest ❤️</h2>

                <p id="typingText"></p>

            </div>

        </div>

        <!-- Next Button -->

        <div class="next-section">

            <a href="birthday.html" id="nextBtn">
                Next Surprise 🎂
            </a>

        </div>

    </div>

    <!-- Audio -->

    <audio id="paperSound">

        <source src="music/paper.mp3" type="audio/mpeg">

    </audio>

    <!-- JavaScript -->

    <script src="love-letter.js"></script>

</body>
</html>

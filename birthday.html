<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="birthday.css">

</head>

<body>

    <!-- Background -->

    <div class="stars"></div>

    <div class="balloons">

        <div class="balloon balloon1"></div>
        <div class="balloon balloon2"></div>
        <div class="balloon balloon3"></div>
        <div class="balloon balloon4"></div>
        <div class="balloon balloon5"></div>

    </div>

    <div class="confetti" id="confetti"></div>

    <!-- Main Container -->

    <div class="container">

        <h1>Happy Birthday ❤️</h1>

        <p class="subtitle">

            Make a wish... then click the candles.

        </p>

        <!-- Cake -->

        <div class="cake">

            <!-- Candles -->

            <div class="candles">

                <div class="candle" data-id="1">

                    <div class="flame"></div>

                </div>

                <div class="candle" data-id="2">

                    <div class="flame"></div>

                </div>

                <div class="candle" data-id="3">

                    <div class="flame"></div>

                </div>

            </div>

            <!-- Cake Layers -->

            <div class="cake-top"></div>

            <div class="cake-middle"></div>

            <div class="cake-bottom"></div>

            <!-- Plate -->

            <div class="plate"></div>

        </div>

        <!-- Birthday Message -->

        <div id="birthdayMessage">

            <h2>🎉 Happy Birthday! 🎉</h2>

            <p>

                May your smile always shine brighter than the stars.

                May every dream you have come true.

                Wishing you endless happiness, love and success.

                Today is your day.

                Enjoy every single moment.

                ❤️

            </p>

        </div>

        <!-- Next Button -->

        <a href="memories.html" id="nextBtn">

            Next Surprise 📸

        </a>

    </div>

    <!-- Audio -->

    <audio id="birthdayMusic">

        <source src="music/happy-birthday.mp3" type="audio/mpeg">

    </audio>

    <audio id="blowSound">

        <source src="music/blow.mp3" type="audio/mpeg">

    </audio>

    <!-- JavaScript -->

    <script src="birthday.js"></script>

</body>

</html>
